name: EXPC portable verification
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, headless tests, inspect and stage compact portable
        shell: pwsh
        run: ./scripts/Build-EXPCdelete.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EXPCdelete-${{ github.sha }}
          path: |
            dist/EXPCdelete.exe
            artifacts/verification/
